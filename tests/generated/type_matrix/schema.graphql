enum Size {
    SMALL
    LARGE
}

input Filter {
    term: String
}

input Payload {
    stringPlain: String
    stringRequired: String!
    stringList: [String!]!
    stringSparse: [String]
    intPlain: Int
    intRequired: Int!
    intList: [Int!]!
    intSparse: [Int]
    idPlain: ID
    idRequired: ID!
    idList: [ID!]!
    idSparse: [ID]
    sizePlain: Size
    sizeRequired: Size!
    sizeList: [Size!]!
    sizeSparse: [Size]
    filterPlain: Filter
    filterRequired: Filter!
    filterList: [Filter!]!
    filterSparse: [Filter]
}

type Echo {
    seen: String!
    size: Size
    sizes: [Size!]!
    tagged(size: Size!, term: String): String!
}

type Query {
    echo(payload: Payload!, stringPlain: String, stringRequired: String, stringList: [String!], stringSparse: [String], intPlain: Int, intRequired: Int, intList: [Int!], intSparse: [Int], idPlain: ID, idRequired: ID, idList: [ID!], idSparse: [ID], sizePlain: Size, sizeRequired: Size, sizeList: [Size!], sizeSparse: [Size], filterPlain: Filter, filterRequired: Filter, filterList: [Filter!], filterSparse: [Filter]): Echo
    labelled(size: Size! = SMALL, term: String = "d"): Echo
}
