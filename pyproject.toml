[project]
name = "iron-gql"
version = "0.13.4"

description = "iron_gql generates typed sync and async GraphQL clients and runtime helpers from schemas for Python services"
readme = "README.md"
authors = [{ name = "Ilia Ablamonov", email = "ilia@flamefork.ru" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["graphql", "gql", "client", "httpx2", "pydantic", "codegen", "async", "sync"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.13"
dependencies = [
    "httpx2[ws]>=2.16.2,<3",
    "pydantic>=2.12.3,<3",
]

[project.optional-dependencies]
codegen = ["graphql-core>=3.3.2,<3.4"]
testing = ["uvicorn>=0.34"]

[project.urls]
Homepage = "https://github.com/Flamefork/iron_gql"
Repository = "https://github.com/Flamefork/iron_gql.git"
Issues = "https://github.com/Flamefork/iron_gql/issues"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "iron-gql[codegen,testing]",
    "basedpyright>=1.31.7",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-httpserver>=1.1.3",
    "pytest-randomly>=4.0.1",
    "ruff>=0.14.1",
    "hypothesis>=6.165.2",
    # Pinned to a major, because the mutation recipes in the justfile are
    # written against mutmut 3's CLI: 2.x scoped a run with `--paths-to-mutate`
    # and 3.x dropped every such option, so an unpinned `--with mutmut` made
    # whether `just mutants-diff` runs at all a question about what PyPI
    # served that day.
    "mutmut>=3.7.0,<4",
    "pytest-timeout>=2.4.0",
]

[tool.basedpyright]
typeCheckingMode = "all"
deprecateTypingAliases = true
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportExplicitAny = "none"

[tool.ruff]
target-version = "py313"

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "ANN",
    "missing-trailing-comma",
    "CPY",
    "D",
    "FIX",
    "logging-f-string",
    "single-line-implicit-string-concatenation",
    "compare-to-empty-string",
    "too-many-return-statements",
    "too-many-statements",
    "no-self-use",
    "ambiguous-unicode-character-string",
    "ambiguous-unicode-character-docstring",
    "ambiguous-unicode-character-comment",
    "runtime-cast-value",
    "TD",
]

[tool.ruff.lint.per-file-ignores]
# module-import-not-at-top-of-file: test files generate committed packages at module level before importing them
"test_*.py" = ["builtin-argument-shadowing", "magic-value-comparison", "S", "FBT", "module-import-not-at-top-of-file"]
# The shared basedpyright harness runs `sys.executable -m basedpyright` on a
# path the tests themselves produced. Listed rule by rule rather than through
# `test_*.py`'s blanket "S": this is the only subprocess call in conftest.
"tests/conftest.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
# print: the chapters print what they fetched -- that is what a reader runs them for
"example/*.py" = ["print"]
# The same reason, for the one test module that is a command rather than a
# test: `just fuzz-scoping` is run for its report, and the report is its stdout.
"tests/fuzz_scoping.py" = ["print"]
# The same for the mutation verdict: the unkilled mutants it lists are the report.
"tests/mutation_report.py" = ["print"]
"tests/generated/**/*.py" = ["complex-structure", "line-too-long", "print"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
strict = true
testpaths = ["tests", "example"]
filterwarnings = ["error"]
addopts = [
    "--import-mode=importlib",
    "--no-cov-on-fail",
    "--cov-report=term-missing:skip-covered",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A test that deadlocks fails with every thread's stack instead of hanging the
# run. The thread method, because it ends the whole process: the signal method
# only interrupts the main thread, and a test that then waits on a deadlocked
# worker -- leaving a `ThreadPoolExecutor` does -- hangs again with no second
# alarm. The cost is that the run stops at the first hang. faulthandler dumps
# the stacks 5 s earlier from C, so they arrive even when a hang holds the GIL.
timeout = 30
faulthandler_timeout = 25
timeout_method = "thread"

[tool.mutmut]
# mutmut runs the suite inside a copy of the project and copies only the
# source and `tests/` by default. The README is read by the snippet typecheck,
# the `justfile` by the recipe tests in `tests/test_mutation_report.py`, and
# `example/` is in `testpaths`: without them the copy fails its first test run,
# or silently kills mutants with a smaller suite than `pytest` runs.
also_copy = ["README.md", "justfile", "example/"]
# The coverage exemption of `exclude_also` below, applied to mutation: a
# `raise AssertionError` marks an invariant unreachable by construction, so no
# test can reach its mutants, and leaving them out keeps that noise out of the
# report (ADR 0007).
do_not_mutate_patterns = ["raise AssertionError"]

[tool.coverage.run]
branch = true
# `*/pytest-of-*/*` covers every tree a test builds under `tmp_path` -- the
# generated packages and the corpus modules the discovery oracle imports and
# runs. That source is fixture text, not library code, and leaving it in the
# report both mixes another run's line numbers into the file list this project
# reads for real gaps and drowns the real total (937 corpus modules put the
# figure under the floor). `example/*.py` is the same case: the chapters are
# written to be read, and the generator plus basedpyright are what prove them.
omit = ["tests/*.py", "example/*.py", "*/gql/*.py", "*/pytest-of-*/*"]
data_file = ".coverage/db.sqlite"

[tool.coverage.html]
directory = ".coverage/htmlcov"

[tool.coverage.report]
# `raise AssertionError` marks internal-invariant crashes that are
# unreachable by construction; every other uncovered branch is either a
# missing test or dead defensive code to delete.
exclude_also = ["@overload", "raise AssertionError"]
fail_under = 96
