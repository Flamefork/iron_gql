name: "Main"

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run lint
        run: just lint
      - name: Run test
        run: just test
      - name: Check example is up to date
        run: |
          just generate-example
          git diff --exit-code example/
      - name: Check generated test packages are committed
        run: |
          test -z "$(git status --porcelain tests/generated/)" || {
            git status --porcelain tests/generated/
            echo "tests/generated/ is stale: run 'just test' and commit the result"
            exit 1
          }
  publish:
    if: startsWith(github.event.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
