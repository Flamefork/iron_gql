name: "Slow checks"

# Полный scan внешнего Python-кода, mutation testing и scoping fuzzer стоят
# дороже основного suite, поэтому запускаются по расписанию и вручную.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  slow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Проверить установленные Python-пакеты
        run: just scan-real-code
      - name: Fuzz the scoping oracle
        run: just fuzz-scoping 5000
      - name: Run mutants
        run: just mutants
