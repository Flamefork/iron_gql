name: "Slow checks"

# The full scan of external Python code, mutation testing and the scoping fuzzer
# cost more than the main suite, so they run on a schedule and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  slow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Check installed Python packages
        run: just scan-real-code
      - name: Fuzz the scoping oracle
        run: just fuzz-scoping 5000
      - name: Run mutants
        run: just mutants
